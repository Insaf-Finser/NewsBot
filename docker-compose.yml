services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 3
    volumes:
      - "pg_data:/var/lib/postgresql/data"

  app:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on: 
      db:
        condition: service_healthy

volumes:
  pg_data: